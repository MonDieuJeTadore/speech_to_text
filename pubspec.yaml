name: mp3_to_text
description: Windows desktop app that transcribes French speech from MP3 files to text with whisper.cpp.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  file_picker: 10.3.10 # newer version not working
  path: ^1.9.1
  provider: ^6.1.5
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
